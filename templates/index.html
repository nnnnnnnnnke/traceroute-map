<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traceroute Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #1e293b;
            padding: 12px 20px;
            border-bottom: 1px solid #334155;
        }
        .header-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        h1 {
            font-size: 1.15rem;
            font-weight: 600;
            color: #38bdf8;
            white-space: nowrap;
        }
        .input-group {
            display: flex;
            gap: 6px;
            flex: 1;
            min-width: 300px;
            align-items: center;
        }
        input[type="text"] {
            flex: 1;
            padding: 7px 14px;
            border: 1px solid #475569;
            border-radius: 6px;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: #38bdf8; }
        select {
            padding: 7px 10px;
            border: 1px solid #475569;
            border-radius: 6px;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 0.85rem;
        }
        button {
            padding: 7px 20px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .source-toggle {
            display: flex;
            gap: 0;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #475569;
        }
        .source-toggle label {
            padding: 7px 14px;
            font-size: 0.85rem;
            cursor: pointer;
            background: #0f172a;
            color: #94a3b8;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .source-toggle input { display: none; }
        .source-toggle input:checked + label {
            background: #2563eb;
            color: white;
        }
        .method-group, .location-group { display: flex; align-items: center; gap: 4px; }
        .method-group span, .location-group span { font-size: 0.8rem; color: #64748b; }
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        #map {
            flex: 1;
            min-height: 400px;
        }
        .sidebar {
            width: 380px;
            background: #1e293b;
            border-left: 1px solid #334155;
            overflow-y: auto;
            padding: 16px;
        }
        .status {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: center;
        }
        .status.loading { background: #1e3a5f; color: #7dd3fc; }
        .status.error { background: #3b1219; color: #fca5a5; }
        .status.success { background: #14352a; color: #86efac; }
        .probe-info {
            padding: 8px 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            background: #1a1a2e;
            border: 1px solid #334155;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .probe-info b { color: #c084fc; }
        .hop-list { list-style: none; }
        .hop-item {
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 4px;
            background: #0f172a;
            border: 1px solid #334155;
            font-size: 0.82rem;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .hop-item:hover { border-color: #38bdf8; }
        .hop-item.no-geo { opacity: 0.5; }
        .hop-num {
            display: inline-block;
            width: 26px;
            font-weight: 700;
            color: #38bdf8;
        }
        .hop-ip { font-family: monospace; color: #f1f5f9; }
        .hop-rtt { color: #94a3b8; margin-left: 6px; }
        .hop-hostname {
            margin-top: 2px;
            padding-left: 26px;
            color: #7dd3fc;
            font-size: 0.75rem;
            font-family: monospace;
            word-break: break-all;
        }
        .hop-location {
            margin-top: 2px;
            padding-left: 26px;
            color: #94a3b8;
            font-size: 0.78rem;
        }
        .hop-isp {
            margin-top: 1px;
            padding-left: 26px;
            color: #64748b;
            font-size: 0.72rem;
        }
        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: #64748b;
        }
        .empty-state p { margin-top: 8px; font-size: 0.85rem; }
        @media (max-width: 768px) {
            .main-content { flex-direction: column; }
            .sidebar { width: 100%; max-height: 40vh; border-left: none; border-top: 1px solid #334155; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-row">
            <h1>Traceroute Map</h1>
            <div class="source-toggle">
                <input type="radio" name="source" id="srcGlobal" value="globalping" checked>
                <label for="srcGlobal">Global Probe</label>
                <input type="radio" name="source" id="srcLocal" value="local">
                <label for="srcLocal">Local</label>
            </div>
            <div class="input-group">
                <input type="text" id="target" placeholder="ドメイン or IP (例: google.com)" />
                <div class="location-group" id="locationGroup">
                    <span>From:</span>
                    <select id="location">
                        <option value="JP">Japan</option>
                        <option value="US">USA</option>
                        <option value="DE">Germany</option>
                        <option value="GB">UK</option>
                        <option value="SG">Singapore</option>
                        <option value="AU">Australia</option>
                        <option value="BR">Brazil</option>
                        <option value="IN">India</option>
                        <option value="FR">France</option>
                        <option value="KR">Korea</option>
                        <option value="NL">Netherlands</option>
                        <option value="CA">Canada</option>
                    </select>
                </div>
                <div class="method-group" id="methodGroup" style="display:none;">
                    <select id="method">
                        <option value="tcp">TCP</option>
                        <option value="udp">UDP</option>
                        <option value="icmp">ICMP</option>
                    </select>
                </div>
                <button id="traceBtn" onclick="doTrace()">Trace</button>
            </div>
        </div>
    </header>
    <div class="main-content">
        <div id="map"></div>
        <div class="sidebar">
            <div id="status"></div>
            <div id="probeInfo"></div>
            <div id="hopList">
                <div class="empty-state">
                    <p>ドメインまたはIPアドレスを入力して<br>「Trace」をクリックしてください</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([35, 135], 3);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 18,
        }).addTo(map);

        let markers = [];
        let polylines = [];

        function clearMap() {
            markers.forEach(m => map.removeLayer(m));
            polylines.forEach(p => map.removeLayer(p));
            markers = [];
            polylines = [];
        }

        function hopColor(index, total) {
            const hue = (index / Math.max(total, 1)) * 240;
            return `hsl(${240 - hue}, 80%, 55%)`;
        }

        function setStatus(msg, type) {
            const el = document.getElementById('status');
            el.className = 'status ' + type;
            el.textContent = msg;
        }

        // Toggle source UI
        document.querySelectorAll('input[name="source"]').forEach(r => {
            r.addEventListener('change', () => {
                const isGlobal = document.getElementById('srcGlobal').checked;
                document.getElementById('locationGroup').style.display = isGlobal ? '' : 'none';
                document.getElementById('methodGroup').style.display = isGlobal ? 'none' : '';
            });
        });

        async function doTrace() {
            const target = document.getElementById('target').value.trim();
            if (!target) return;

            const isGlobal = document.getElementById('srcGlobal').checked;
            const btn = document.getElementById('traceBtn');
            btn.disabled = true;
            btn.textContent = '実行中...';
            const waitMsg = isGlobal ? 'Globalping プローブで実行中... (最大30秒)' : 'Traceroute を実行中... (最大60秒)';
            setStatus(waitMsg, 'loading');
            document.getElementById('hopList').innerHTML = '';
            document.getElementById('probeInfo').innerHTML = '';
            clearMap();

            const body = { target };
            if (isGlobal) {
                body.source = 'globalping';
                body.location = document.getElementById('location').value;
            } else {
                body.source = 'local';
                body.method = document.getElementById('method').value;
            }

            try {
                const resp = await fetch('/api/traceroute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                const data = await resp.json();

                if (!resp.ok) {
                    setStatus(data.error || 'Error', 'error');
                    return;
                }

                const hops = data.hops;
                const responding = hops.filter(h => h.ip !== '*');
                setStatus(`${hops.length} ホップ (${responding.length} 応答) → ${data.target}`, 'success');

                // Show probe info if globalping
                if (data.probe) {
                    const p = data.probe;
                    document.getElementById('probeInfo').innerHTML =
                        `<div class="probe-info"><b>Probe:</b> ${p.city}, ${p.country} — ${p.network} (AS${p.asn})</div>`;
                }

                // Build hop list
                const listHtml = hops.map((h, i) => {
                    const loc = h.geo
                        ? `${h.geo.city}${h.geo.city && h.geo.country ? ', ' : ''}${h.geo.country}`
                        : '';
                    const isp = h.geo ? `${h.geo.isp} (${h.geo.as})` : '';
                    const rtt = h.rtt !== null ? `${h.rtt} ms` : '';
                    const cls = h.geo ? '' : 'no-geo';
                    const hostname = h.hostname || '';
                    return `<li class="hop-item ${cls}" onclick="focusHop(${i})">
                        <span class="hop-num">${h.hop}</span>
                        <span class="hop-ip">${h.ip}</span>
                        <span class="hop-rtt">${rtt}</span>
                        ${hostname && hostname !== h.ip ? `<div class="hop-hostname">${hostname}</div>` : ''}
                        ${loc ? `<div class="hop-location">${loc}</div>` : ''}
                        ${isp ? `<div class="hop-isp">${isp}</div>` : ''}
                    </li>`;
                }).join('');
                document.getElementById('hopList').innerHTML = `<ul class="hop-list">${listHtml}</ul>`;

                // Plot on map
                const geoHops = hops.filter(h => h.geo);

                // Add probe location as starting point if available
                if (data.probe && data.probe.lat && data.probe.lon) {
                    const probeMarker = L.circleMarker([data.probe.lat, data.probe.lon], {
                        radius: 10,
                        fillColor: '#c084fc',
                        color: '#fff',
                        weight: 2,
                        fillOpacity: 0.9,
                    }).addTo(map);
                    probeMarker.bindPopup(`<b>Probe</b><br>${data.probe.city}, ${data.probe.country}<br>${data.probe.network}`);
                    markers.push(probeMarker);
                }

                const latlngs = [];
                if (data.probe && data.probe.lat) {
                    latlngs.push([data.probe.lat, data.probe.lon]);
                }

                geoHops.forEach((h, i) => {
                    const lat = h.geo.lat;
                    const lon = h.geo.lon;
                    const color = hopColor(i, geoHops.length);
                    latlngs.push([lat, lon]);

                    const marker = L.circleMarker([lat, lon], {
                        radius: 7,
                        fillColor: color,
                        color: '#fff',
                        weight: 2,
                        fillOpacity: 0.9,
                    }).addTo(map);

                    const loc = `${h.geo.city}${h.geo.city && h.geo.country ? ', ' : ''}${h.geo.country}`;
                    marker.bindPopup(`
                        <b>Hop ${h.hop}</b><br>
                        IP: ${h.ip}<br>
                        ${h.hostname ? h.hostname + '<br>' : ''}
                        ${loc}<br>
                        ${h.geo.isp}<br>
                        RTT: ${h.rtt !== null ? h.rtt + ' ms' : 'N/A'}
                    `);
                    markers.push(marker);
                });

                // Draw route lines
                if (latlngs.length > 1) {
                    for (let i = 0; i < latlngs.length - 1; i++) {
                        const color = hopColor(i, latlngs.length);
                        const line = L.polyline([latlngs[i], latlngs[i + 1]], {
                            color: color,
                            weight: 3,
                            opacity: 0.7,
                            dashArray: '8, 6',
                        }).addTo(map);
                        polylines.push(line);
                    }
                }

                if (latlngs.length > 0) {
                    map.fitBounds(latlngs, { padding: [50, 50] });
                }

                window._hops = hops;

            } catch (err) {
                setStatus('通信エラー: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Trace';
            }
        }

        function focusHop(index) {
            if (!window._hops || !window._hops[index]) return;
            const h = window._hops[index];
            if (h.geo) {
                map.setView([h.geo.lat, h.geo.lon], 6);
                const m = markers.find(m => {
                    const ll = m.getLatLng();
                    return Math.abs(ll.lat - h.geo.lat) < 0.001 && Math.abs(ll.lng - h.geo.lon) < 0.001;
                });
                if (m) m.openPopup();
            }
        }

        document.getElementById('target').addEventListener('keydown', e => {
            if (e.key === 'Enter') doTrace();
        });
    </script>
</body>
</html>
